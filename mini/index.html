<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiloKaki Mini — Coming Soon</title>
  <meta name="description" content="KiloKaki Mini App — log meals on the web. Coming soon.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --green: #84cc16;
      --green-dark: #4d7c0f;
      --cream: #fffaf2;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .emoji { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 16px; color: var(--muted); line-height: 1.6; max-width: 400px; }
    a {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 28px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      font-size: 15px;
    }
    a:hover { background: var(--green-dark); }
  </style>
</head>
<body>
  <div class="emoji">🍡</div>
  <h1>KiloKaki Mini</h1>
  <p>Log meals from your browser. Coming soon.</p>
  <p style="margin-top:8px;">In the meantime, use the Telegram bot to track your food.</p>
  <a href="/">← Back to KiloKaki</a>
